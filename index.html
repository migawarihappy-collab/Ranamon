<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="デジモントーク - 水のスピリットVer.">

    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <title>デジモントーク - 水のスピリットVer.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1a2d;
        }
        body {
            color: #fff;
            font-family: 'Courier New', Courier, monospace, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 95%;
            max-width: 450px;
            height: 95%;
            max-height: 700px;
            background: #122b46;
            border: 4px solid #00d2ff;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* ネームエントリー画面 */
        .name-entry-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #08111e;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .name-entry-box {
            width: 90%;
            border: 4px double #00d2ff;
            padding: 30px 10px;
            background: #0d1b2a;
            text-align: center;
        }
        .name-entry-title {
            font-size: 18px;
            color: #00d2ff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* API設定 */
        .api-setting {
            margin-bottom: 5px;
            font-size: 11px;
            color: #88c0d0;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .check-btn {
            background: #17a2b8;
            padding: 3px 8px;
            font-size: 10px;
            border: none;
            color: #fff;
            border-radius: 3px;
            cursor: pointer;
        }
        select {
            background: #0d1b2a;
            color: #fff;
            border: 2px solid #00d2ff;
            padding: 3px;
            border-radius: 4px;
            font-size: 12px;
        }
        .bg-selector-container {
            margin-bottom: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            padding: 0 4px;
        }
        .user-info-container {
            font-size: 12px;
            color: #fff;
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .rename-btn, .status-btn, .battle-btn {
            background: #1c3d5a;
            padding: 2px 6px;
            font-size: 10px;
            border: 1px solid #00d2ff;
            border-radius: 3px;
            cursor: pointer;
            color: #fff;
        }
        .status-btn {
            background: #00d2ff;
            color: #000;
            font-weight: bold;
            border-color: #80e5ff;
        }
        .battle-btn {
            background: #ff4444;
            color: #fff;
            font-weight: bold;
            border-color: #ff8888;
        }
        .battle-btn:disabled {
            background: #555;
            border-color: #777;
            color: #aaa;
            cursor: not-allowed;
        }

        /* モーダル共通 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 10, 20, 0.85);
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            width: 85%;
            background: #0d1b2a;
            border: 4px double #00d2ff;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-family: 'DotGothic16', sans-serif;
            text-align: left;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
        .modal-title {
            font-size: 16px;
            color: #00d2ff;
            text-align: center;
            border-bottom: 2px dashed #1c3d5a;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .status-label { color: #88c0d0; }
        .status-val { font-weight: bold; color: #fff; }

        .emotion-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #162a3f;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #1c3d5a;
            margin: 8px 0 12px 0;
        }
        .emotion-item {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .modal-close-btn {
            display: block;
            width: 100%;
            padding: 6px;
            background: #1c3d5a;
            color: #fff;
            border: 1px solid #00d2ff;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-family: 'DotGothic16', sans-serif;
            margin-top: 10px;
        }

        /* バトル難易度ボタン */
        .diff-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #1c3d5a;
            color: #fff;
            border: 2px solid #00d2ff;
            border-radius: 6px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .diff-btn:hover {
            background: #007acc;
        }

        /* バトル実行画面モーダル */
        .battle-screen-box {
            width: 95%;
            height: 90%;
            background: #08111e;
            border: 4px double #ff4444;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .battle-arena {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #122b46;
            border: 2px solid #3a6b8c;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            position: relative;
        }
        .fighter-box {
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fighter-img {
            height: 64px;
            image-rendering: pixelated;
            transition: transform 0.2s;
        }
        .fighter-img.adult-size {
            height: 90px;
        }
        /* バトルアニメーション用クラス */
        .facing-right {
            transform: scaleX(-1);
        }
        .shake-horizontal {
            animation: shakeHoriz 0.4s ease-in-out;
        }
        .bounce-vertical {
            animation: bounceVert 0.5s ease-in-out infinite alternate;
        }

        @keyframes shakeHoriz {
            0% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        @keyframes bounceVert {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .hp-bar-bg {
            width: 100%;
            height: 10px;
            background: #444;
            border: 1px solid #fff;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar-fill {
            height: 100%;
            background: #00ffcc;
            width: 100%;
            transition: width 0.3s ease;
        }
        .battle-log-box {
            height: 120px;
            background: #000;
            border: 2px solid #00d2ff;
            padding: 8px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 12px;
            color: #fff;
            overflow-y: auto;
            text-align: left;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* お世話コマンドエリア */
        .care-panel {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 4px;
        }
        .care-btn {
            flex: 1;
            padding: 6px 2px;
            font-size: 10px;
            font-family: 'DotGothic16', sans-serif;
            background: #1c3d5a;
            color: #fff;
            border: 2px solid #3a6b8c;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s, background 0.2s;
        }
        .care-btn.active {
            opacity: 1.0;
            pointer-events: auto;
            background: #007acc;
            animation: pulseBtn 1s infinite alternate;
        }
        @keyframes pulseBtn {
            0% { border-color: #fff; }
            100% { border-color: #00d2ff; }
        }

        /* 表示エリア */
        .digimon-box {
            flex-grow: 1;
            min-height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            border: 2px inset #1c3d5a;
            background: #08111e; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .digimon-img {
            height: 64px;
            width: auto;
            object-fit: contain;
            position: absolute;
            bottom: 15px;
            
            image-rendering: pixelated;
            image-rendering: crisp-edges;

            animation: walkPatternLeft 8s infinite ease-in-out;
            animation-delay: 0.1s;
            transition: height 0.3s ease;
        }

        .digimon-img.adult-size {
            height: 96px;
        }

        .action-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
            gap: 20px;
            background: rgba(0,20,40,0.3);
        }
        .action-digimon-img, .action-effect-img {
            height: 64px;
            object-fit: contain;
            image-rendering: pixelated;
            transition: height 0.3s ease;
        }

        .action-digimon-img.adult-size {
            height: 96px;
        }

        @keyframes walkPatternLeft {
            0% { transform: translateX(0) scaleX(1); }
            12.5% { transform: translateX(-60px) scaleX(1); }
            25% { transform: translateX(-60px) scaleX(1); }
            25.01% { transform: translateX(-60px) scaleX(-1); }
            37.5% { transform: translateX(0) scaleX(-1); }
            50% { transform: translateX(0) scaleX(-1); }
            62.5% { transform: translateX(60px) scaleX(-1); }
            75% { transform: translateX(60px) scaleX(-1); }
            75.01% { transform: translateX(60px) scaleX(1); }
            87.5% { transform: translateX(0) scaleX(1); }
            100% { transform: translateX(0) scaleX(1); }
        }

        .dialogue-box {
            background: #08111e;
            border: 2px solid #00d2ff;
            padding: 8px 10px;
            min-height: 70px;
            text-align: left;
            margin-bottom: 8px;
            line-height: 1.4;
            font-size: 14px; 
            font-family: 'DotGothic16', sans-serif;
        }
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="password"] {
            padding: 8px;
            border: 2px solid #00d2ff;
            background: #0d1b2a;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"] {
            flex-grow: 1;
        }
        button {
            padding: 8px 12px;
            background: #00d2ff;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #errorLog, #modelListLog {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            padding: 10px;
            border-radius: 4px;
            font-size: 10px;
            text-align: left;
            display: none;
            word-break: break-all;
            white-space: pre-wrap;
            box-sizing: border-box;
            z-index: 110;
        }
        #errorLog { background: #400; color: #ff9999; }
        #modelListLog { background: #1e3a1e; color: #99ff99; }
    </style>
</head>
<body>

<div class="container">
    <!-- ネームエントリー画面 -->
    <div id="nameEntryScreen" class="name-entry-screen" style="display: none;">
        <div class="name-entry-box">
            <div class="name-entry-title">アナタノ ナマエ オシエテ！</div>
            <div class="input-box" style="justify-content: center;">
                <input type="text" id="nameInput" placeholder="アナタの名前" style="text-align: center; max-width: 200px;" onkeypress="if(event.key === 'Enter') saveName()">
                <button onclick="saveName()">OK</button>
            </div>
        </div>
    </div>

    <!-- ステータスモーダル画面 -->
    <div id="statusModal" class="modal-overlay" style="display: none;" onclick="closeStatusModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title">📊 デジモンステータス</div>
            <div class="status-row">
                <span class="status-label">【 なまえ 】</span>
                <span class="status-val" id="statName">ズルモン</span>
            </div>
            <div class="status-row">
                <span class="status-label">【 しゅぞく 】</span>
                <span class="status-val" id="statType" style="color: #ffcc00;">フリー</span>
            </div>
            <div class="status-row">
                <span class="status-label">【 せいかく 】</span>
                <span class="status-val" id="statPersonality" style="color: #00d2ff;">素直</span>
            </div>
            <div class="status-row">
                <span class="status-label">【 しんかまで 】</span>
                <span class="status-val" id="statEvolutionCount" style="color: #00ffcc;">0 / 10</span>
            </div>

            <div style="font-size: 11px; color: #88c0d0; margin-top: 10px; margin-bottom: 4px;">【 かんじょうち（努力値） 】</div>
            <div class="emotion-grid">
                <div class="emotion-item">
                    <span style="color: #aaa;">信頼(HP):</span>
                    <span id="statNormal" style="color: #fff;">0</span>
                </div>
                <div class="emotion-item">
                    <span style="color: #ff66aa;">歓喜(特攻):</span>
                    <span id="statHappy" style="color: #ff66aa;">0</span>
                </div>
                <div class="emotion-item">
                    <span style="color: #ff4444;">激情(攻撃):</span>
                    <span id="statAngry" style="color: #ff4444;">0</span>
                </div>
                <div class="emotion-item">
                    <span style="color: #aa66ff;">感受(防御):</span>
                    <span id="statSad" style="color: #aa66ff;">0</span>
                </div>
            </div>

            <button class="modal-close-btn" onclick="toggleStatusModal(false)">とじる</button>
        </div>
    </div>

    <!-- バトル難易度選択モーダル -->
    <div id="battleSelectModal" class="modal-overlay" style="display: none;" onclick="toggleBattleSelectModal(false)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title">⚔️ バトル難易度選択</div>
            <button class="diff-btn" onclick="startBattle(1)">★☆☆☆ (成長期級)<br><small style="color:#aaa;">勝利報酬: 全感情値 +2</small></button>
            <button class="diff-btn" onclick="startBattle(2)">★★☆☆ (成熟期級)<br><small style="color:#aaa;">勝利報酬: 全感情値 +4</small></button>
            <button class="diff-btn" onclick="startBattle(3)">★★★☆ (完全体級)<br><small style="color:#aaa;">勝利報酬: 全感情値 +6</small></button>
            <button class="diff-btn" onclick="startBattle(4)">★★★★ (究極体級)<br><small style="color:#aaa;">勝利報酬: 全感情値 +8</small></button>
            <button class="modal-close-btn" onclick="toggleBattleSelectModal(false)">やめる</button>
        </div>
    </div>

    <!-- バトル対戦画面モーダル -->
    <div id="battleScreenModal" class="modal-overlay" style="display: none;">
        <div class="battle-screen-box">
            <div style="font-size: 14px; color: #ff4444; font-weight: bold; text-align: center; font-family: 'DotGothic16', sans-serif;">⚔️ ネットバトル ⚔️</div>
            
            <div class="battle-arena">
                <!-- プレイヤー側 (右向き＝scaleX(-1)で敵を向く) -->
                <div class="fighter-box">
                    <div id="bPlayerName" style="font-size: 11px; font-family: 'DotGothic16', sans-serif;">---</div>
                    <img id="bPlayerImg" class="fighter-img facing-right" src="" alt="player">
                    <div class="hp-bar-bg"><div id="bPlayerHpBar" class="hp-bar-fill"></div></div>
                    <div id="bPlayerHpText" style="font-size: 10px; margin-top:2px;">HP: 0/0</div>
                </div>

                <div style="font-size: 18px; font-weight: bold; color: #ff4444;">VS</div>

                <!-- 敵側 (左向き＝通常) -->
                <div class="fighter-box">
                    <div id="bEnemyName" style="font-size: 11px; font-family: 'DotGothic16', sans-serif;">---</div>
                    <img id="bEnemyImg" class="fighter-img" src="" alt="enemy">
                    <div class="hp-bar-bg"><div id="bEnemyHpBar" class="hp-bar-fill"></div></div>
                    <div id="bEnemyHpText" style="font-size: 10px; margin-top:2px;">HP: 0/0</div>
                </div>
            </div>

            <div id="battleLog" class="battle-log-box"></div>

            <button id="battleCloseBtn" class="modal-close-btn" style="display:none;" onclick="closeBattleScreen()">閉じる</button>
        </div>
    </div>

    <!-- APIキー設定 -->
    <div class="api-setting">
        <div>
            <label for="apiKey">Gemini API Key: </label>
            <input type="password" id="apiKey" placeholder="AIZA..." style="padding: 2px; font-size: 10px; width: 150px;" onchange="saveApiKey()">
        </div>
        <div>
            <button class="check-btn" onclick="checkAvailableModels()">👉 キーで使えるモデルを調べる</button>
        </div>
        <div id="modelSelectContainer" style="display: none;">
            <select id="modelSelect"></select>
        </div>
    </div>

    <!-- 設定・情報エリア -->
    <div class="bg-selector-container">
        <div>
            <label for="bgSelect">背景🌊: </label>
            <select id="bgSelect" onchange="changeBackground()">
                <option value="">なし</option>
                <option value="mati.jpg">はじまりの町</option>
                <option value="sima.jpg">ファイル島</option>
                <option value="umi.jpg">ネットの海</option>
                <option value="shinkai.jpg">深海エリア</option>
                <option value="den.jpg">サイバー空間</option>
                <option value="den2.jpg">サイバー空間2</option>
                <option value="frontia.jpg">フロンティア</option>
                <option value="hero.jpg">十闘士</option>
            </select>
        </div>
        <div class="user-info-container">
            <span>👤:<span id="userNameDisplay">---</span></span>
            <button class="rename-btn" onclick="showNameEntry()">かえる</button>
            <button class="status-btn" onclick="toggleStatusModal(true)">📊 ステータス</button>
            <button id="battleOpenBtn" class="battle-btn" onclick="toggleBattleSelectModal(true)">⚔️ バトル (<span id="battleTicketDisplay">0</span>)</button>
        </div>
    </div>

    <!-- お世話コマンドパネル -->
    <div class="care-panel">
        <button id="careMeal" class="care-btn" onclick="executeCare('happy', 5, 'eat_animation.gif', 'ごはんをもらって<span style=&quot;color: #ff66aa; font-weight: bold;&quot;>【歓喜】</span>の感情値が上がった！')">🍙 エサ</button>
        <button id="careTrain" class="care-btn" onclick="executeCare('normal', 5, 'Training_animation.gif', 'トレーニングを頑張って<span style=&quot;color: #00ccff; font-weight: bold;&quot;>【信頼】</span>の感情値が上がった！')">💪 トレーニング </button>
        <button id="careDefense" class="care-btn" onclick="executeCare('angry', 5, 'battle_animation.gif', 'ネットワークウィルスを撃退して<span style=&quot;color: #ff4444; font-weight: bold;&quot;>【激情】</span>の感情値が上がった！')">🛡️ ウイルス退治</button>
        <button id="careData" class="care-btn" onclick="executeCare('sad', 5, 'deta_animation.gif', 'ネットワークデータ収集をして<span style=&quot;color: #aa66ff; font-weight: bold;&quot;>【感受】</span>の感情値が上がった！')">💻 収集</button>
    </div>

    <!-- デジモン表示エリア -->
    <div class="digimon-box" id="digimonBox">
        <img id="digimonImage" src="zurumon_normal.gif" alt="normal" class="digimon-img" loading="eager" onerror="this.src='normal.gif'">

        <div id="actionContainer" class="action-container" style="display: none;">
            <img id="actionDigimonImg" class="action-digimon-img" src="" alt="digimon">
            <img id="actionEffectImg" class="action-effect-img" src="" alt="action">
        </div>
    </div>

    <!-- セリフ窓 -->
    <div class="dialogue-box">
        <div style="font-size: 11px; color: #00d2ff; margin-bottom: 3px;">
            <span id="digimonName">ズルモン</span>
            <span id="personalityDisplay" style="font-size: 10px; color: #88c0d0; margin-left: 5px;"></span>
            <span id="careCounterDisplay" style="font-size: 10px; color: #00ffcc; float: right;">お世話まであと: 0/5</span>
        </div>
        <div id="dialogueText"></div>
    </div>

    <!-- 入力エリア -->
    <div class="input-box">
        <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">送信</button>
    </div>

</div>

    let careCount = 0;

    let isPerformingAction = false; 
    let currentForm = 'zurumon';

        marine:      { type: "ワクチン", baseHp: 220, baseAtk: 60, baseSpAtk: 120, baseDef: 85, baseSpd: 110 },
        afmon:       { type: "データ",   baseHp: 240, baseAtk: 110, baseSpAtk: 105, baseDef: 90, baseSpd: 100 },

    const DIGIMON_DETAILS = {
        zurumon: "超悪質のコンピュータウイルスとコンピューターを悪用する人間の負の念が融合して生まれたスライムのような粘液状のボディを持つ幼年期Ⅰデジモン。",
        pagumon: "ズルモンの進化系、幼年期Ⅱの小型デジモン。",

        ganimon: "甲殻類特有の硬い外骨格と強いハサミを持つ甲殻類型デジモン。",

        lanamon: "伝説の十闘士の一人が残した水のヒューマンスピリットで進化したハイブリッド体。",
        ebidramon: "エビのような姿をした巨大な水棲竜型デジモン。",
        gesomon: "白いイカのような姿をした水棲軟体型デジモン。",
        teslajerrymon: "刺激と快感を求めて格闘技のデータを吸収して成長した成熟期のデジモン。",
        karumaramon: "伝説の十闘士の一人が残した水のビーストスピリットで進化したハイブリッド体。",
        hmon: "人間のような手足を持つ水棲獣人型デジモン。",
        mdmon: "深い深海に住むデビモンの亜種。",
        tetismon: "ネットの海の最も深い海溝で発見された記録がある女性の姿をした水棲獣人型の完全体デジモン。",
        emarmeymon: "古代のネットの海を支配していた伝説の十闘士の一体である究極体デジモン。",
        marine: "ネットの海に棲む妖精型デジモン。",
        afmon: "サイボーグ型デジモン。",
        kutiramon: "ネットの海の深部に生息し海の死霊と呼ばれているデジモン。"
    };

    const PERSONALITIES = {
        suinao: { name: "素直", greetings: [`{NAME}、こんにちは！お話しよ！`, `あ！{NAME}だ！まってたよ！なにしてあそぶ？`], prompt: `【性格: 素直】相手に真っ直ぐで素直な性格です。` },
        nekketsu: { name: "熱血", greetings: [`よっ！{NAME}！元気万端だぜ！`, `オッス！{NAME}、今日も気合い入れていこうぜ！`], prompt: `【性格: 熱血】元気がいっぱいで熱血な性格です。` },
        oshitoyaka: { name: "おしとやか", greetings: [`まあ、{NAME}様…！本日もお会いできて嬉しゅうございますわ。`], prompt: `【性格: おしとやか】丁寧で上品なおしとやかな性格です。` },
        cool: { name: "クール", greetings: [`やあ、{NAME}。待っていたぞ。`], prompt: `【性格: クール】落ち着いていてクールな性格です。` },
        nonki: { name: "のんき", greetings: [`ん〜〜？{NAME}だ〜！あそぼ〜〜！`], prompt: `【性格: のんき】マイペースでのんびりした性格です。` },
        wagamama: { name: "ワガママ", greetings: [`ちょっと{NAME}！遅いじゃない！`], prompt: `【性格: ワガママ】勝気でちょっと高飛車な性格です。` },
        mesugaki: { name: "メスガキ", greetings: [`あれれ～♡{NAME}だ～♡キャハハ♡`], prompt: `【性格: メスガキ】生意気で小悪魔な性格です。` },
        shy: { name: "シャイ", greetings: [`あ…えっと…{NAME}さん…っ！こ、こんにちは…！`], prompt: `【性格: シャイ】内気で人見知りな性格です。` }
    };

    // モーダル関連
    function toggleStatusModal(show) {
        const modal = document.getElementById('statusModal');
        if (show) {
            updateStatusModalData();
            modal.style.display = 'flex';
        } else {
            modal.style.display = 'none';
        }
    }

    function closeStatusModal(event) {
        if (event.target.id === 'statusModal') toggleStatusModal(false);
    }

    function updateStatusModalData() {
        document.getElementById('statName').innerText = DIGIMON_NAMES[currentForm] || "デジモン";
        const data = DIGIMON_DATA[currentForm] || { type: "フリー" };
        document.getElementById('statType').innerText = data.type;

        const pInfo = PERSONALITIES[currentPersonalityKey];
        document.getElementById('statPersonality').innerText = pInfo ? pInfo.name : "不明";

        const threshold = getNextEvolutionThreshold();
        const labelText = ULTIMATE_DIGIMONS.includes(currentForm) ? "てんせいまで" : "しんかまで";
        document.querySelector('#statusModal .status-row:nth-child(5) .status-label').innerText = `【 ${labelText} 】`;
        document.getElementById('statEvolutionCount').innerText = `${talkCount} / ${threshold}`;

        document.getElementById('statNormal').innerText = emotionCounts.normal || 0;
        document.getElementById('statHappy').innerText = emotionCounts.happy || 0;
        document.getElementById('statAngry').innerText = emotionCounts.angry || 0;
        document.getElementById('statSad').innerText = emotionCounts.sad || 0;
    }

    function getNextEvolutionThreshold() {
        if (currentForm === 'zurumon') return 10;
        if (currentForm === 'pagumon') return 20;
        if (CHILD_DIGIMONS.includes(currentForm)) return 30;
        if (ADULT_DIGIMONS.includes(currentForm)) return 40;
        if (PERFECT_DIGIMONS.includes(currentForm)) return 70;
        if (ULTIMATE_DIGIMONS.includes(currentForm)) return 80;
        return 0;
    }

    function canBattle() {
        return (CHILD_DIGIMONS.includes(currentForm) || 
               ADULT_DIGIMONS.includes(currentForm) || 
               PERFECT_DIGIMONS.includes(currentForm) || 
               ULTIMATE_DIGIMONS.includes(currentForm)) && battleTickets > 0;
    }

    function updateBattleButtonState() {
        const btn = document.getElementById('battleOpenBtn');
        document.getElementById('battleTicketDisplay').innerText = battleTickets;
        btn.disabled = !canBattle();
    }

    function saveData() {
        const state = {
            currentForm: currentForm,
            currentPersonalityKey: currentPersonalityKey,
            talkCount: talkCount,
            careCount: careCount,
            talkForBattleCount: talkForBattleCount,
            battleTickets: battleTickets,
            emotionCounts: emotionCounts,
            bgValue: document.getElementById('bgSelect').value
        };
        localStorage.setItem('digimonState_deep', JSON.stringify(state));
    }

    function loadData() {
        const savedApiKey = localStorage.getItem('geminiApiKey');
        if (savedApiKey) document.getElementById('apiKey').value = savedApiKey;

        const savedState = localStorage.getItem('digimonState_deep');
        if (savedState) {
            try {
                const state = JSON.parse(savedState);
                currentForm = state.currentForm || 'zurumon';
                currentPersonalityKey = state.currentPersonalityKey || '';
                talkCount = state.talkCount || 0;
                careCount = state.careCount || 0;
                talkForBattleCount = state.talkForBattleCount || 0;
                battleTickets = state.battleTickets || 0;
                if (state.emotionCounts) emotionCounts = state.emotionCounts;
                
                if (state.bgValue !== undefined) {
                    document.getElementById('bgSelect').value = state.bgValue;
                    changeBackground();
                }
            } catch (e) {
                console.error("ロード失敗:", e);
            }
        }
    }

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) localStorage.setItem('geminiApiKey', key);
    }

    function updateDigimonScale() {
        const digimonImg = document.getElementById('digimonImage');
        const actionDigimonImg = document.getElementById('actionDigimonImg');
        const isLarge = ADULT_DIGIMONS.includes(currentForm) || PERFECT_DIGIMONS.includes(currentForm) || ULTIMATE_DIGIMONS.includes(currentForm);

        if (isLarge) {
            digimonImg.classList.add('adult-size');
            actionDigimonImg.classList.add('adult-size');
        } else {
            digimonImg.classList.remove('adult-size');
            actionDigimonImg.classList.remove('adult-size');
        }
    }

    function setPersonalityGreeting(trainerName) {
        const pInfo = PERSONALITIES[currentPersonalityKey];
        if (!pInfo || !pInfo.greetings) return;
        const list = pInfo.greetings;
        const rawGreeting = list[Math.floor(Math.random() * list.length)];
        document.getElementById('dialogueText').innerText = rawGreeting.replace(/{NAME}/g, trainerName);
    }

    function rollRandomPersonality() {
        const keys = Object.keys(PERSONALITIES);
        currentPersonalityKey = keys[Math.floor(Math.random() * keys.length)];
    }

    function updatePersonalityDisplay() {
        if (currentPersonalityKey && PERSONALITIES[currentPersonalityKey]) {
            document.getElementById('personalityDisplay').innerText = `（せいかく：${PERSONALITIES[currentPersonalityKey].name}）`;
        }
    }

    function updateSystemInstruction() {
        const pInfo = PERSONALITIES[currentPersonalityKey];
        const name = DIGIMON_NAMES[currentForm] || "デジモン";
        const detail = DIGIMON_DETAILS[currentForm] || "";

        window.SYSTEM_INSTRUCTION = `
あなたはデジモンの「${name}」です。
【デジモン情報】
${detail}

【性格指定】の口調やトーンを強く意識して会話してください。
${pInfo ? pInfo.prompt : ""}

会話の返答は、必ず以下のJSON形式でのみ出力してください。
{"emotion": "感情の英単語", "text": "セリフ"}

【感情の定義（※必ず英語で）】
- normal: 通常、きょとんとしている、疑問、穏やか
- happy: 嬉しい、喜んでいる、ウキウキ、共感、元気
- angry: 怒っている、ぷんぷん、興奮、ツッコミ
- sad: 悲しい、泣きそう、感動、怖い
`;
    }

    window.onload = function() {
        loadData();
        if (!currentPersonalityKey) rollRandomPersonality();

        updatePersonalityDisplay();
        updateSystemInstruction();
        updateDigimonScale();
        updateBattleButtonState();

        document.getElementById('digimonImage').src = `${currentForm}_normal.gif`;
        document.getElementById('digimonName').innerText = DIGIMON_NAMES[currentForm] || "デジモン";

        const savedName = localStorage.getItem('trainerName');
        if (!savedName) {
            showNameEntry();
        } else {
            document.getElementById('userNameDisplay').innerText = savedName;
            setPersonalityGreeting(savedName);
        }
        updateCareUI();
    }

    function showNameEntry() {
        document.getElementById('nameEntryScreen').style.display = 'flex';
        const savedName = localStorage.getItem('trainerName');
        if (savedName) document.getElementById('nameInput').value = savedName;
    }

    function saveName() {
        const nameInput = document.getElementById('nameInput').value.trim();
        if (!nameInput) {
            alert('名前を入力してください！');
            return;
        }
        localStorage.setItem('trainerName', nameInput);
        document.getElementById('userNameDisplay').innerText = nameInput;
        document.getElementById('nameEntryScreen').style.display = 'none';
        setPersonalityGreeting(nameInput);
    }

    function changeBackground() {
        const bgSelect = document.getElementById('bgSelect');
        const digimonBox = document.getElementById('digimonBox');
        if (bgSelect.value === "") {
            digimonBox.style.background = "#08111e";
        } else {
            bgSelect.blur();
            digimonBox.style.background = `url('${bgSelect.value}') no-repeat center`;
            digimonBox.style.backgroundSize = "cover";
        }
        saveData();
    }

    async function checkAvailableModels() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const modelListLog = document.getElementById('modelListLog');
        const errorLog = document.getElementById('errorLog');
        const modelSelectContainer = document.getElementById('modelSelectContainer');
        const modelSelect = document.getElementById('modelSelect');

        modelListLog.style.display = 'none';
        errorLog.style.display = 'none';

        if (!apiKey) {
            alert('APIキーを入力してからボタンを押してください！');
            return;
        }

        saveApiKey();
        modelListLog.innerText = "確認中...";
        modelListLog.style.display = 'block';

        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`エラー (Status: ${response.status})`);
            
            const data = await response.json();
            const availableModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
            
            modelSelect.innerHTML = '';
            availableModels.forEach(m => {
                const shortName = m.name.replace('models/', '');
                const option = document.createElement('option');
                option.value = shortName;
                option.text = shortName;
                modelSelect.appendChild(option);
            });

            if(modelSelect.querySelector('option[value="gemini-3.1-flash-lite"]')){
                 modelSelect.value = "gemini-3.1-flash-lite";
            }

            modelListLog.innerText = "【準備OK！】\nプルダウンからモデルを選んで会話を始めてください。";
            modelSelectContainer.style.display = 'block';
            setTimeout(() => { modelListLog.style.display = 'none'; }, 3000);

        } catch (error) {
            modelListLog.style.display = 'none';
            errorLog.innerText = `モデル情報の取得に失敗しました。\n詳細: ${error.message}`;
            errorLog.style.display = 'block';
        }
    }

    function updateCareUI() {
        const counterDisplay = document.getElementById('careCounterDisplay');
        const buttons = [
            document.getElementById('careMeal'),
            document.getElementById('careTrain'),
            document.getElementById('careDefense'),
            document.getElementById('careData')
        ];

        if (careCount >= 5 && !isPerformingAction) {
            counterDisplay.innerText = "お世話OK！";
            counterDisplay.style.color = "#00d2ff";
            buttons.forEach(btn => btn.classList.add('active'));
        } else {
            counterDisplay.innerText = `お世話まで ${careCount}/5`;
            counterDisplay.style.color = "#00ffcc";
            buttons.forEach(btn => btn.classList.remove('active'));
        }
    }

    function executeCare(emotionKey, addAmount, actionGifName, messageText) {
        if (careCount < 5 || isPerformingAction) return;

        isPerformingAction = true;
        emotionCounts[emotionKey] += addAmount;
        document.getElementById('dialogueText').innerHTML = messageText;

        const digimonImage = document.getElementById('digimonImage');
        const actionContainer = document.getElementById('actionContainer');
        const actionDigimonImg = document.getElementById('actionDigimonImg');
        const actionEffectImg = document.getElementById('actionEffectImg');

        updateDigimonScale();
        digimonImage.style.display = 'none';

        actionDigimonImg.src = `${currentForm}_${emotionKey}.gif`;
        actionDigimonImg.classList.add('facing-right');
        actionEffectImg.src = actionGifName;
        actionContainer.style.display = 'flex';

        careCount = 0;
        updateCareUI();
        saveData();

        setTimeout(() => {
            actionContainer.style.display = 'none';
            actionDigimonImg.classList.remove('facing-right');
            digimonImage.src = `${currentForm}_normal.gif`;
            digimonImage.style.display = 'block';

            isPerformingAction = false;
            updateCareUI();
            checkEvolutionProgress();
        }, 4000);
    }

    async function sendMessage() {
        if (isPerformingAction) return;

        const apiKey = document.getElementById('apiKey').value.trim();
        const userInput = document.getElementById('userInput').value.trim();
        const dialogueText = document.getElementById('dialogueText');
        const errorLog = document.getElementById('errorLog');
        const modelSelect = document.getElementById('modelSelect');

        errorLog.style.display = 'none';
        if (!apiKey) {
            alert('最初にGeminiのAPIキーを入力してください！');
            return;
        }
        if (!userInput) return;

        saveApiKey();
        const selectedModel = modelSelect.value || 'gemini-3.1-flash-lite';
        const currentTrainerName = localStorage.getItem('trainerName') || "パートナー";
        const activeInstruction = window.SYSTEM_INSTRUCTION.replace(/{NAME}/g, currentTrainerName);

        dialogueText.innerText = "考え中...";
        document.getElementById('userInput').value = "";
        document.getElementById('userInput').blur();

        const url = `https://generativelanguage.googleapis.com/v1/models/${selectedModel}:generateContent?key=${apiKey}`;
        const requestBody = {
            contents: [{ parts: [{ text: `${activeInstruction}\n\n話しかけているパートナーの名前: "${currentTrainerName}"\nUser: "${userInput}"\nYour Answer:` }] }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        emotion: { type: "STRING", enum: ["normal", "happy", "angry", "sad"] },
                        text: { type: "STRING" }
                    },
                    required: ["emotion", "text"]
                }
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(`API通信エラー (Status: ${response.status})\nメッセージ: ${JSON.stringify(errData)}`);
            }

            const data = await response.json();
            const result = JSON.parse(data.candidates[0].content.parts[0].text.trim());

            const emotion = result.emotion || 'normal';
            document.getElementById('digimonImage').src = `${currentForm}_${emotion}.gif`;
            dialogueText.innerText = result.text;

            talkCount++;
            if (careCount < 5) careCount++;

            // 3回会話ごとにバトル権付与
            talkForBattleCount++;
            if (talkForBattleCount >= 3) {
                talkForBattleCount = 0;
                battleTickets++;
            }

            if (emotionCounts.hasOwnProperty(emotion)) {
                emotionCounts[emotion]++;
            }

            updateCareUI();
            updateBattleButtonState();
            saveData();
            checkEvolutionProgress();

        } catch (error) {
            dialogueText.innerText = "エラーが発生しました。下のボックスを確認してください。";
            errorLog.innerText = error.message;
            errorLog.style.display = 'block';
        }
    }

    function getNextFormByEmotion(currentStage) {
        const dominant = getDominantEmotion() || 'happy';
        const evolutionMap = {
            child: { normal: 'kaimon', happy: 'jerrymon', angry: 'ganimon', sad: 'gizamon' },
            adult: { normal: 'gesomon', happy: 'teslajerrymon', angry: 'ebidramon', sad: 'lanamon' },
            perfect: { normal: 'hmon', happy: 'tetismon', angry: 'mdmon', sad: 'karumaramon' },
            ultimate: { normal: 'marine', happy: 'afmon', angry: 'kutiramon', sad: 'emarmeymon' }
        };
        return evolutionMap[currentStage][dominant];
    }

    function getDominantEmotion() {
        let maxCount = -1;
        let dominantEmotions = [];

        ['happy', 'angry', 'sad', 'normal'].forEach(emo => {
            const count = emotionCounts[emo];
            if (count > maxCount) {
                maxCount = count;
                dominantEmotions = [emo];
            } else if (count === maxCount && count > 0) {
                dominantEmotions.push(emo);
            }
        });

        if (dominantEmotions.length !== 1 || maxCount === 0) return null;
        return dominantEmotions[0];
    }

    function checkEvolutionProgress() {
        if (isPerformingAction) return;

        if (currentForm === 'zurumon' && talkCount >= 10) {
            executeEvolution('pagumon', 'ズルモンは パグモン に進化した！');
        } else if (currentForm === 'pagumon' && talkCount >= 20) {
            const nextForm = getNextFormByEmotion('child');
            executeEvolution(nextForm, `パグモンは ${DIGIMON_NAMES[nextForm]} に進化した！`);
        } else if (CHILD_DIGIMONS.includes(currentForm) && talkCount >= 30) {
            const nextForm = getNextFormByEmotion('adult');
            executeEvolution(nextForm, `${DIGIMON_NAMES[currentForm]}は ${DIGIMON_NAMES[nextForm]} に進化した！`);
        } else if (ADULT_DIGIMONS.includes(currentForm) && talkCount >= 40) {
            const nextForm = getNextFormByEmotion('perfect');
            executeEvolution(nextForm, `${DIGIMON_NAMES[currentForm]}は ${DIGIMON_NAMES[nextForm]} に超進化した！`);
        } else if (PERFECT_DIGIMONS.includes(currentForm) && talkCount >= 70) {
            const nextForm = getNextFormByEmotion('ultimate');
            executeEvolution(nextForm, `${DIGIMON_NAMES[currentForm]}は ${DIGIMON_NAMES[nextForm]} に究極進化した！`);
        } else if (ULTIMATE_DIGIMONS.includes(currentForm) && talkCount >= 80) {
            rebirthToZurumon();
        }
    }

    function executeEvolution(nextForm, msg) {
        alert(`${DIGIMON_NAMES[currentForm]} 進化〜〜！！`);
        currentForm = nextForm;

        rollRandomPersonality();
        updatePersonalityDisplay();
        updateSystemInstruction();
        updateDigimonScale();
        updateBattleButtonState();

        document.getElementById('dialogueText').innerText = `${msg}（せいかくが「${PERSONALITIES[currentPersonalityKey].name}」になったよ！）`;
        document.getElementById('digimonName').innerText = DIGIMON_NAMES[nextForm];
        document.getElementById('digimonImage').src = `${currentForm}_normal.gif`;

        talkCount = 0;
        emotionCounts = { happy: 0, angry: 0, sad: 0, normal: 0 };
        saveData();
    }

    function rebirthToZurumon() {
        const prevName = DIGIMON_NAMES[currentForm];
        alert(`${prevName}は静かに泡となって消え、デジタマからやり直します…！`);

        currentForm = 'zurumon';
        document.getElementById('digimonName').innerText = DIGIMON_NAMES[currentForm];

        rollRandomPersonality();
        updatePersonalityDisplay();
        updateSystemInstruction();
        updateDigimonScale();
        updateBattleButtonState();

        document.getElementById('digimonImage').src = "zurumon_normal.gif";
        document.getElementById('dialogueText').innerText = `${prevName}はデジタマへと還り、ズルモンとして生まれ変わった！（せいかく：${PERSONALITIES[currentPersonalityKey].name}）`;

        talkCount = 0;
        careCount = 0;
        emotionCounts = { happy: 0, angry: 0, sad: 0, normal: 0 };
        updateCareUI();
        saveData();
    }


    // ==========================================
    // --- バトル演出・進行ロジック ---
    // ==========================================

    function toggleBattleSelectModal(show) {
        if (show && !canBattle()) {
            if (battleTickets <= 0) {
                alert("バトル権がありません！あと会話を重ねて開放してください。");
            } else {
                alert("バトルは成長期以降から解放されます！");
            }
            return;
        }
        document.getElementById('battleSelectModal').style.display = show ? 'flex' : 'none';
    }

    function getTypeMultiplier(atkType, defType) {
        if (atkType === "アンノウン" || defType === "アンノウン") return 0.5;
        if (atkType === "バリアブル" || defType === "バリアブル") return 2.0;
        if (atkType === "フリー" || defType === "フリー") return 1.0;

        if (atkType === "ワクチン" && defType === "ウイルス") return 2.0;
        if (atkType === "ウイルス" && defType === "データ") return 2.0;
        if (atkType === "データ" && defType === "ワクチン") return 2.0;

        if (atkType === "ワクチン" && defType === "データ") return 0.5;
        if (atkType === "ウイルス" && defType === "ワクチン") return 0.5;
        if (atkType === "データ" && defType === "ウイルス") return 0.5;

        return 1.0;
    }

    function calculateFighterStats(formKey, emotions = { normal:0, happy:0, angry:0, sad:0 }, isPlayer = true) {
        const base = DIGIMON_DATA[formKey] || { type:"フリー", baseHp:100, baseAtk:30, baseSpAtk:30, baseDef:20, baseSpd:20 };
        return {
            isPlayer: isPlayer,
            name: DIGIMON_NAMES[formKey],
            type: base.type,
            formKey: formKey,
            maxHp: base.baseHp + (emotions.normal * 2),
            hp: base.baseHp + (emotions.normal * 2),
            atk: base.baseAtk + (emotions.angry * 2),
            spAtk: base.baseSpAtk + (emotions.happy * 2),
            def: base.baseDef + (emotions.sad * 2),
            spd: base.baseSpd,
            imgEl: document.getElementById(isPlayer ? 'bPlayerImg' : 'bEnemyImg')
        };
    }

    let currentBattleInterval = null;

    function startBattle(difficulty) {
        if (battleTickets <= 0) return;
        battleTickets--; // バトル権消費
        updateBattleButtonState();
        saveData();

        toggleBattleSelectModal(false);

        let enemyPool = [];
        if (difficulty === 1) enemyPool = CHILD_DIGIMONS;
        else if (difficulty === 2) enemyPool = ADULT_DIGIMONS;
        else if (difficulty === 3) enemyPool = PERFECT_DIGIMONS;
        else enemyPool = ULTIMATE_DIGIMONS;

        const enemyForm = enemyPool[Math.floor(Math.random() * enemyPool.length)];
        const enemyEmotions = {
            normal: difficulty * 5 + Math.floor(Math.random() * 5),
            happy: difficulty * 5 + Math.floor(Math.random() * 5),
            angry: difficulty * 5 + Math.floor(Math.random() * 5),
            sad: difficulty * 5 + Math.floor(Math.random() * 5)
        };

        const player = calculateFighterStats(currentForm, emotionCounts, true);
        const enemy = calculateFighterStats(enemyForm, enemyEmotions, false);

        const playerMultiplier = getTypeMultiplier(player.type, enemy.type);
        const enemyMultiplier = getTypeMultiplier(enemy.type, player.type);

        player.atk = Math.floor(player.atk * playerMultiplier);
        player.spAtk = Math.floor(player.spAtk * playerMultiplier);
        enemy.atk = Math.floor(enemy.atk * enemyMultiplier);
        enemy.spAtk = Math.floor(enemy.spAtk * enemyMultiplier);

        // UI設定
        document.getElementById('bPlayerName').innerText = `${player.name} (${player.type})`;
        player.imgEl.src = `${player.formKey}_normal.gif`;
        player.imgEl.className = "fighter-img facing-right" + ((ADULT_DIGIMONS.includes(player.formKey) || PERFECT_DIGIMONS.includes(player.formKey) || ULTIMATE_DIGIMONS.includes(player.formKey)) ? " adult-size" : "");

        document.getElementById('bEnemyName').innerText = `${enemy.name} (${enemy.type})`;
        enemy.imgEl.src = `${enemy.formKey}_normal.gif`;
        enemy.imgEl.className = "fighter-img" + ((ADULT_DIGIMONS.includes(enemy.formKey) || PERFECT_DIGIMONS.includes(enemy.formKey) || ULTIMATE_DIGIMONS.includes(enemy.formKey)) ? " adult-size" : "");

        document.getElementById('battleCloseBtn').style.display = 'none';
        document.getElementById('battleScreenModal').style.display = 'flex';

        const logBox = document.getElementById('battleLog');
        logBox.innerText = `野生の ${enemy.name} があらわれた！\n`;
        if (playerMultiplier > 1.0) logBox.innerText += `👉 相性有利！攻撃力が2倍アップ！\n`;
        if (playerMultiplier < 1.0) logBox.innerText += `👉 相性不利… 攻撃力が半減！\n`;

        updateHpUI(player, enemy);

        let turn = 1;
        currentBattleInterval = setInterval(async () => {
            if (player.hp <= 0 || enemy.hp <= 0) {
                clearInterval(currentBattleInterval);
                finishBattle(player, enemy, difficulty);
                return;
            }

            logBox.innerText += `\n--- ターン ${turn} --- \n`;

            let first = player, second = enemy;
            if (enemy.spd > player.spd) {
                first = enemy; second = player;
            }

            // 1人目の攻撃
            await performBattleTurn(first, second, logBox);
            updateHpUI(player, enemy);

            // 2人目の反撃（生存していれば）
            if (second.hp > 0) {
                await performBattleTurn(second, first, logBox);
                updateHpUI(player, enemy);
            }

            logBox.scrollTop = logBox.scrollHeight;
            turn++;
        }, 2200);
    }

    // アニメーションを伴う攻撃処理（方向修正版）
    function performBattleTurn(attacker, defender, logBox) {
        return new Promise(resolve => {
            const isSpecial = Math.random() < 0.5;
            const attackVal = isSpecial ? attacker.spAtk : attacker.atk;
            const attackName = isSpecial ? "特殊攻撃" : "物理攻撃";

            let damage = Math.max(5, attackVal - Math.floor(defender.def / 2));
            damage = Math.floor(damage * (0.9 + Math.random() * 0.2));

            // プレイヤー側（左側）かどうかの判定クラス
            const facingClass = attacker.isPlayer ? " facing-right" : "";
            const defenderFacingClass = defender.isPlayer ? " facing-right" : "";

            // 【演出1】攻撃側: angry.gif + 横揺れ (プレイヤー側なら右向き反転を保持)
            attacker.imgEl.src = `${attacker.formKey}_angry.gif`;
            attacker.imgEl.className = `fighter-img${facingClass} shake-horizontal` + 
                ((ADULT_DIGIMONS.includes(attacker.formKey) || PERFECT_DIGIMONS.includes(attacker.formKey) || ULTIMATE_DIGIMONS.includes(attacker.formKey)) ? " adult-size" : "");

            logBox.innerText += `${attacker.name} の ${attackName}！\n`;

            setTimeout(() => {
                // 攻撃アニメーション終了時、元の通常姿へ
                attacker.imgEl.className = `fighter-img${facingClass}` + 
                    ((ADULT_DIGIMONS.includes(attacker.formKey) || PERFECT_DIGIMONS.includes(attacker.formKey) || ULTIMATE_DIGIMONS.includes(attacker.formKey)) ? " adult-size" : "");
                attacker.imgEl.src = `${attacker.formKey}_normal.gif`;

                // 【演出2】被弾側: sad.gif + ダメージ計算
                defender.hp = Math.max(0, defender.hp - damage);
                defender.imgEl.src = `${defender.formKey}_sad.gif`;
                defender.imgEl.className = `fighter-img${defenderFacingClass}` + 
                    ((ADULT_DIGIMONS.includes(defender.formKey) || PERFECT_DIGIMONS.includes(defender.formKey) || ULTIMATE_DIGIMONS.includes(defender.formKey)) ? " adult-size" : "");
                
                logBox.innerText += `${defender.name} に ${damage} ダメージ！\n`;

                setTimeout(() => {
                    if (defender.hp > 0) {
                        defender.imgEl.src = `${defender.formKey}_normal.gif`;
                    }
                    resolve();
                }, 600);
            }, 600);
        });
    }

    function updateHpUI(player, enemy) {
        const pPct = Math.max(0, (player.hp / player.maxHp) * 100);
        const ePct = Math.max(0, (enemy.hp / enemy.maxHp) * 100);

        document.getElementById('bPlayerHpBar').style.width = `${pPct}%`;
        document.getElementById('bPlayerHpText').innerText = `HP: ${player.hp}/${player.maxHp}`;

        document.getElementById('bEnemyHpBar').style.width = `${ePct}%`;
        document.getElementById('bEnemyHpText').innerText = `HP: ${enemy.hp}/${enemy.maxHp}`;
    }

    function finishBattle(player, enemy, difficulty) {
        const logBox = document.getElementById('battleLog');
        const rewardAmount = difficulty * 2;

        if (player.hp > 0) {
            // 勝利演出：自デジモン happy.gif ＋ 縦揺れ / 敵デジモン sad.gif
            player.imgEl.src = `${player.formKey}_happy.gif`;
            player.imgEl.classList.add('bounce-vertical');
            enemy.imgEl.src = `${enemy.formKey}_sad.gif`;

            logBox.innerText += `\n🎉 バトルに勝利した！\nすべての感情値が +${rewardAmount} 上がった！`;
            emotionCounts.normal += rewardAmount;
            emotionCounts.happy += rewardAmount;
            emotionCounts.angry += rewardAmount;
            emotionCounts.sad += rewardAmount;
            saveData();
        } else {
            // 敗北演出：自デジモン sad.gif / 敵デジモン happy.gif
            player.imgEl.src = `${player.formKey}_sad.gif`;
            enemy.imgEl.src = `${enemy.formKey}_happy.gif`;

            logBox.innerText += `\n💀 バトルに敗北した…`;
        }

        logBox.scrollTop = logBox.scrollHeight;
        document.getElementById('battleCloseBtn').style.display = 'block';
    }

    function closeBattleScreen() {
        const playerImg = document.getElementById('bPlayerImg');
        playerImg.classList.remove('bounce-vertical');
        document.getElementById('battleScreenModal').style.display = 'none';
        checkEvolutionProgress();
    }
</script>
